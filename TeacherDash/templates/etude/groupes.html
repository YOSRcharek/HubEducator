{% extends 'baseT.html' %}
{% block content %}
<div class="container mt-5">
  <h2 class="text-center mb-4">My Study Groups</h2>
  <a href="{% url 'add_groupe' %}" class="btn btn-primary mb-3">+ Create a Group</a>

  <div class="row">
    {% for g in groupes %}
    <div class="col-md-4 mb-3">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>{{ g.nom }}</h5>
          <p>{{ g.description|truncatewords:15 }}</p>
          <small>Created on {{ g.date_creation|date:"d/m/Y" }}</small>
          <div class="mt-3 text-center">
            <a href="{% url 'teacher_group_detail' g.id %}" class="btn btn-primary btn-sm">🔍 View</a>
            <a href="{% url 'edit_group' g.id %}" class="btn btn-warning btn-sm">✏️ Edit</a>
            <a href="{% url 'delete_group' g.id %}" class="btn btn-danger btn-sm">🗑 Delete</a>
          </div>
        </div>
      </div>
    </div>
    {% empty %}
    <p class="text-center">No study groups created yet.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
