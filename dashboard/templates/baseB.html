{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>HubEducator | Dashboard</title>

  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'website/img/favicons/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'website/img/favicons/favicon-16x16.png' %}">
  <link rel="shortcut icon" type="image/x-icon" href="{% static 'website/img/favicons/favicon.ico' %}">

  <link rel="stylesheet" href="{% static 'dashboard/vendors/mdi/css/materialdesignicons.min.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/vendors/base/vendor.bundle.base.css' %}">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
  <!-- CSS Uploadcare -->
  <link rel="stylesheet" href="https://ucarecdn.com/libs/widget/3.0.4/uploadcare.min.css">

</head>

<body>

  {% include 'includes/navbar.html' %}

  <main>
    {% if messages %}
    <div class="container mt-3">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>
  <script>
    UPLOADCARE_PUBLIC_KEY = '80a35ae75c230fc4117e';
  </script>

  <script src="{% static 'dashboard/vendors/@popperjs/popper.min.js' %}"></script>
  <script src="{% static 'dashboard/vendors/base/vendor.bundle.base.js' %}"></script>

  <script src="{% static 'dashboard/js/template.js' %}"></script>

  <script src="{% static 'dashboard/vendors/chart.js/Chart.min.js' %}"></script>
  <script src="{% static 'dashboard/vendors/progressbar.js/progressbar.min.js' %}"></script>
  <script src="{% static 'dashboard/vendors/chartjs-plugin-datalabels/chartjs-plugin-datalabels.js' %}"></script>
  <script src="{% static 'dashboard/vendors/justgage/raphael-2.1.4.min.js' %}"></script>
  <script src="{% static 'dashboard/vendors/justgage/justgage.js' %}"></script>
  <script src="{% static 'dashboard/js/jquery.cookie.js' %}" type="text/javascript"></script>
  <!-- Custom js for this page-->
  <script src="{% static 'dashboard/js/dashboard.js' %}"></script>
  <script type="text/javascript" charset="utf-8"
    src="https://ucarecdn.com/libs/widget/3.0.4/uploadcare.min.js"></script>

</body>

</html>
