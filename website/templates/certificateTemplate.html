<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style type="text/css">
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      body {
        color: black;
        font-family: Georgia, serif;
        font-size: 24px;
        text-align: center;
      }

      /* --- Bouton d'impression --- */
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 999;
      }

      @media print {
        .print-button {
          display: none;
        }
      }

      /* --- Conteneur principal du certificat --- */
      .container {
        border: 20px solid rgb(0, 9, 105);
        width: 1000px;
        height: 600px;
        position: relative;
        background-color: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);

        display: flex;
        flex-direction: column;
        justify-content: center; /* centre verticalement le contenu */
        align-items: center; /* centre horizontalement */
        padding: 40px 60px;
      }

      /* --- Bande supérieure avec deux logos --- */
      .header {
        position: absolute;
        top: 20px;
        left: 50px;
        right: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header .left-logo img {
        width: 110px;
        height: auto;
      }

      .header .right-logo img {
        width: 90px;
        height: auto;
      }

      /* --- Titre central HubEducator --- */
      .title {
        color: rgb(0, 9, 105);
        font-size: 42px;
        font-weight: bold;
        margin-top: 70px;
        letter-spacing: 2px;
      }

      .marquee {
        color: tan;
        font-size: 46px;
        margin: 15px 0;
      }

      .certificate-title {
        color: rgb(0, 9, 105);
        font-size: 30px;
        margin: 10px 0 20px 0;
      }

      .assignment {
        font-size: 22px;
        margin-bottom: 10px;
      }

      .person {
        border-bottom: 2px solid black;
        font-size: 32px;
        font-style: italic;
        margin: 10px auto 15px auto;
        width: 400px;
      }

      /* --- Ligne de spécialité --- */
      .speciality {
        font-size: 20px;
        color: rgb(60, 60, 60);
        margin-bottom: 20px;
      }

      .reason {
        font-size: 20px;
        margin-bottom: 40px;
        color: #333;
      }

      /* --- Bas du certificat --- */
      .footer {
        position: absolute;
        bottom: 35px;
        left: 50px;
        right: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .director {
        font-size: 18px;
        font-weight: bold;
        text-align: left;
      }

      .signature img {
        width: 140px;
        height: auto;
      }
    </style>
  </head>

  <body>
    <!-- Bouton Imprimer -->
    <button class="btn btn-outline-dark print-button" onclick="window.print()">
       Imprimer le certificat
    </button>

    <div class="container">
      <!-- Bande supérieure -->
      <div class="header">
        <div class="left-logo">
          <img
            src="https://1cd2gyfjyi.ucarecd.net/b548c405-4541-4de3-97af-f3acc9ef1fad/logon.png"
            alt="HubEducator Logo"
          />
        </div>
        <div class="right-logo">
          <img
            src="https://1cd2gyfjyi.ucarecd.net/8e526c16-d235-4509-b185-8935d9c7ed48/goldLogo.png"
            alt="Gold Number 1"
          />
        </div>
      </div>

      <!-- Contenu central -->
      <div class="title">HubEducator</div>

      <div class="marquee">Certificate of Completion</div>

      <div class="certificate-title">
        {{ certificate_title|default:"Certificate Title" }}
      </div>

      <div class="assignment">This certificate is presented to</div>

      <div class="person">{{ name|default:"Nom de l'utilisateur" }}</div>

      <div class="speciality">
        Speciality: {{ speciality|default:"Spécialité" }}
      </div>

      <div class="reason">
        For deftly defying the laws of gravity<br />
        and flying high
      </div>

      <div class="footer">
        <div class="director">
          Directeur<br />
          Chaouch Abdessalem
        </div>
        <div class="signature">
          <img
            src="https://1cd2gyfjyi.ucarecd.net/e5e6b1d4-b6d2-4bdf-98f0-b3f19eae448e/signature.png"
            alt="Signature"
          />
        </div>
      </div>
    </div>
  </body>
</html>
