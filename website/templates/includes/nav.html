      <nav class="navbar navbar-expand-lg navbar-light sticky-top py-3 d-block" data-navbar-on-scroll="data-navbar-on-scroll">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
            <img src="{% static 'website/img/gallery/logo-n.png' %}" height="45" alt="logo" /></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"> </span></button>
          <div class="collapse navbar-collapse border-top border-lg-0 mt-4 mt-lg-0" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto pt-2 pt-lg-0 font-base">
              <li class="nav-item px-2"><a class="nav-link active" aria-current="page" href="{% url 'home' %}">Home</a></li>
              <li class="nav-item px-2"><a class="nav-link" aria-current="page" href="{% url 'pricing' %}">Pricing</a></li>
              <li class="nav-item px-2"><a class="nav-link" aria-current="page" href="{% url 'coursesUser' %}">Courses</a></li>
              <li class="nav-item px-2"><a class="nav-link" aria-current="page" href="{% url 'user-research' %}">User Research</a></li>
            </ul>
            {% if user.is_authenticated %}
              <div class="user-dropdown" style="position: relative; display: inline-block;">
              <!-- Dropdown button -->
                <button class="dropdown-btn" style="background: none; border: none; cursor: pointer; display: flex; align-items: center;">
                <img src="{% static 'core/assets/media/avatars/default-user-image2.png' %}"  alt="User Icon" style="width: 30px; height: 30px; border-radius: 50%; margin-right: 8px;">
                    <span>{{ user.username }}</span>
                </button>

                <!-- Dropdown content -->
                <div class="dropdown-content" style="display: none; position: absolute; background-color: #fff; min-width: 120px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 5px; z-index: 1000;">
                    <a href="{% url 'mycourses' %}" style="display: block; padding: 8px 12px; text-decoration: none; color: #333;">My courses</a>
                    <a href="{% url 'profil' %}" style="display: block; padding: 8px 12px; text-decoration: none; color: #333;">Profil</a>
                    <a href="{% url 'logout' %}" style="display: block; padding: 8px 12px; text-decoration: none; color: #333;">Logout</a>
                </div>
              </div>
          {% else %}
            <a class="btn btn-primary order-1 order-lg-0"href="{% url 'login' %}">Sign In</a>
          {% endif %}

            <form class="d-flex my-3 d-block d-lg-none">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
              <button class="btn btn-outline-primary" type="submit">Search</button>
            </form>
            <div class="dropdown d-none d-lg-block">
              <button class="btn btn-outline-light ms-2" id="dropdownMenuButton1" type="submit" data-bs-toggle="dropdown" aria-expanded="false"><i class="fas fa-search text-800"></i></button>
              <ul class="dropdown-menu dropdown-menu-lg-end" aria-labelledby="dropdownMenuButton1" style="top:55px">
                <form>
                  <input class="form-control" type="search" placeholder="Search" aria-label="Search" />
                </form>
              </ul>
            </div>
          </div>
        </div>
      </nav>


      <script>
    const dropdownBtn = document.querySelector('.dropdown-btn');
    const dropdownContent = document.querySelector('.dropdown-content');

    dropdownBtn.addEventListener('click', function() {
        dropdownContent.style.display = dropdownContent.style.display === 'block' ? 'none' : 'block';
    });

    // Close dropdown if clicked outside
    window.addEventListener('click', function(e) {
        if (!dropdownBtn.contains(e.target)) {
            dropdownContent.style.display = 'none';
        }
    });
</script>
